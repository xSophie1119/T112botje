name: Build RoutePilot APK

on:
  push:
    branches:
      - routepilot-v3-debug
    paths:
      - 'routepilot/**'
      - '.github/workflows/routepilot-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'routepilot/**'
      - '.github/workflows/routepilot-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: routepilot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test + build V3.0.0 debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RoutePilot-V3.0.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoutePilot-V3.0.0-debug-apk
          path: routepilot/RoutePilot-V3.0.0-debug.apk
          if-no-files-found: error
