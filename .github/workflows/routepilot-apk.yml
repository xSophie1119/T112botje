name: Build RoutePilot APK

on:
  push:
    branches:
      - routepilot-v3.3-routing-core
    paths:
      - 'routepilot/**'
      - 'routepilot-simulator/**'
      - '.github/workflows/routepilot-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'routepilot/**'
      - '.github/workflows/routepilot-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: routepilot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test + build V3.3.0 debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RoutePilot-V3.3.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoutePilot-V3.3.0-debug-apk
          path: routepilot/RoutePilot-V3.3.0-debug.apk
          if-no-files-found: error


  simulator-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate simulator
        run: |
          python -m py_compile routepilot-simulator/server.py
          test -f routepilot-simulator/static/index.html
          test -f routepilot-simulator/static/core.js
          test -f routepilot-simulator/static/app.js
          test -f routepilot-simulator/static/style.css
          node --check routepilot-simulator/static/core.js
          node --check routepilot-simulator/static/app.js
          python - <<'PY'
          import importlib.util, pathlib, tempfile, os
          p = pathlib.Path('routepilot-simulator/server.py')
          os.environ['ROUTEPILOT_SIM_DB'] = str(pathlib.Path(tempfile.gettempdir()) / 'routepilot-sim-ci.sqlite3')
          spec = importlib.util.spec_from_file_location('rp_sim', p)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert len(mod.ANCHORS) >= 30
          assert len(mod.INNER_MUNICIPALITIES) == 8
          assert len(mod.HOSPITAL_SPECS) == 5
          assert len(mod.CARE_SPECS) >= 13
          q = mod.quota_plan(25)
          assert q.count('hospital') >= 5
          assert q.count('care') >= 5
          assert len(q) == 25

          inside={'name':'A','lat':51.55,'lon':5.09,'zone':'inside','municipality':'Tilburg','category':'general'}
          outside={'name':'B','lat':51.60,'lon':4.80,'zone':'outside','municipality':'Breda','category':'general'}
          outside2={'name':'C','lat':51.64,'lon':4.86,'zone':'outside','municipality':'Oosterhout','category':'general'}
          assert mod.validate_regio_trip(inside,outside,24000)[0] is True
          assert mod.validate_regio_trip(outside,inside,24000)[0] is True
          assert mod.validate_regio_trip(outside,outside2,10000)[0] is False
          assert mod.validate_regio_trip(inside,outside,26000)[0] is False

          goirle={'name':'Goirle','lat':51.52,'lon':5.06,'zone':'inside','municipality':'Goirle','category':'general'}
          etz={'name':'ETZ Waalwijk','lat':51.68,'lon':5.07,'zone':'inside','municipality':'Waalwijk','category':'hospital'}
          assert mod.validate_regio_trip(goirle,etz,32000)[0] is True

          assert mod.route_score({'distance': 1000, 'duration': 100, 'geometry': {'coordinates': [[5.09,51.55],[5.10,51.56]]}}, [])[0] > 0
          batch = mod.create_batch(1, 12345)
          snap = mod._batch_snapshot(batch)
          assert snap is not None
          assert snap['requested_count'] == 1
          assert snap['status'] in ('queued','running','completed','partial','failed')
          point = mod._parse_wkt_point('POINT(5.0913 51.5555)')
          assert point == (51.5555, 5.0913)
          print('simulator async smoke test ok')
          PY

      - name: Live PDOK + OSRM smoke test
        continue-on-error: true
        run: |
          python - <<'PY'
          import importlib.util, pathlib, tempfile, os, random
          p = pathlib.Path('routepilot-simulator/server.py')
          os.environ['ROUTEPILOT_SIM_DB'] = str(pathlib.Path(tempfile.gettempdir()) / 'routepilot-sim-live.sqlite3')
          spec = importlib.util.spec_from_file_location('rp_live', p)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          status = mod.source_status()
          print(status)
          assert status['pdok']['ok'], status['pdok']
          assert status['osrm']['ok'], status['osrm']
          pools = mod.build_training_pools(random.Random(32026), 25)
          assert len(pools['general']) >= 40
          assert len(pools['hospital']) == 5
          assert len(pools['care']) >= 10
          hospital_names = {x['name'].split(' · ',1)[0] for x in pools['hospital']}
          assert hospital_names == {
              'ETZ Elisabeth','ETZ TweeSteden','ETZ Waalwijk',
              'Amphia Breda','Jeroen Bosch Ziekenhuis'
          }
          assert pools['inside']
          assert pools['outside']
          print('POOLS:', len(pools['general']), 'general,', len(pools['hospital']), 'hospital,', len(pools['care']), 'care')

          # Eén echte binnen->buiten route als ketentest.
          a = pools['inside'][0]
          candidates = [x for x in pools['outside'] if mod.haversine_m(a['lat'],a['lon'],x['lat'],x['lon']) > 700]
          b = candidates[0]
          route = mod.cached_osrm_route(a['lat'],a['lon'],b['lat'],b['lon'])
          assert route.get('code') == 'Ok'
          assert len(route.get('waypoints') or []) == 2
          assert route.get('routes')
          print('LIVE OK:', a['name'], '->', b['name'], round(route['routes'][0]['distance']), 'm')
          PY


  simulator-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package Windows simulator
        run: |
          test -f routepilot-simulator/START_SIMULATOR_LAN.bat
          test -f routepilot-simulator/server.py
          mkdir -p RoutePilot-V3.5.1-PC
          cp -R routepilot-simulator/* RoutePilot-V3.5.1-PC/

      - name: Upload Windows simulator package
        uses: actions/upload-artifact@v4
        with:
          name: RoutePilot-V3.5.1-PC-Simulator
          path: RoutePilot-V3.5.1-PC
          if-no-files-found: error
