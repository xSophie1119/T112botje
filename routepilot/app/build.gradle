plugins {
    id 'com.android.application'
}

android {
    namespace 'nl.routepilot.prototype'
    compileSdk 35

    defaultConfig {
        applicationId "nl.routepilot.prototype"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
