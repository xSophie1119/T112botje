plugins {
    id 'com.android.application'
}

android {
    namespace 'nl.routepilot.prototype'
    compileSdk 35

    defaultConfig {
        applicationId "nl.routepilot.prototype"
        minSdk 26
        targetSdk 35
        versionCode 33
        versionName "3.3.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            manifestPlaceholders = [cleartextTrafficEnabled: "true"]
        }
        release {
            manifestPlaceholders = [cleartextTrafficEnabled: "false"]
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    implementation 'org.maplibre.gl:android-sdk-vulkan-opengl:13.6.1'
    implementation 'androidx.car.app:app:1.7.0'
    implementation 'androidx.car.app:app-projected:1.7.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
}
